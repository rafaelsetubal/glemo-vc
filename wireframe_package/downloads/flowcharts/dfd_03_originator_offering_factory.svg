<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#f7f4ef"/>
<text x="60" y="96" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#16212d">DFD 03 - Originator Offering Factory</text>
<text x="60" y="146" font-family="Arial, sans-serif" font-size="27" font-weight="500" fill="#677381">The originator creates an Offering. A pool is optional; standalone assets are supported.</text>
<line x1="60" y1="176" x2="1860" y2="176" stroke="#e5dcd0" stroke-width="3"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#677381"/></marker></defs>
<line x1="420" y1="535" x2="550" y2="535" stroke="#677381" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="890" y1="500" x2="1040" y2="345" stroke="#677381" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="845.0" y="397.5" width="240" height="50" rx="8" fill="#fffdfa" stroke="#e5dcd0"/>
<text x="863.0" y="417.5" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#677381">if pooled</text>
<line x1="890" y1="570" x2="1040" y2="745" stroke="#677381" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="845.0" y="632.5" width="240" height="50" rx="8" fill="#fffdfa" stroke="#e5dcd0"/>
<text x="863.0" y="652.5" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#677381">if standalone</text>
<line x1="1400" y1="345" x2="1490" y2="500" stroke="#677381" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1400" y1="745" x2="1490" y2="570" stroke="#677381" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="440" width="330" height="190" rx="18" fill="#fffdfa" stroke="#e5dcd0" stroke-width="2"/>
<rect x="90" y="440" width="10" height="190" rx="5" fill="#f28c28"/>
<text x="124" y="500" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#16212d">Originator Workspace</text>
<text x="124" y="546" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">Manager starts a tokenized</text>
<text x="124" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">offering and assigns responsible</text>
<text x="124" y="610" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">users.</text>
<rect x="550" y="440" width="340" height="190" rx="18" fill="#fffdfa" stroke="#e5dcd0" stroke-width="2"/>
<rect x="550" y="440" width="10" height="190" rx="5" fill="#17212c"/>
<text x="584" y="500" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#16212d">Offering Structure</text>
<text x="584" y="546" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">Decision point: Pool of contracts</text>
<text x="584" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">or Standalone tokenized asset.</text>
<rect x="1040" y="250" width="360" height="190" rx="18" fill="#fffdfa" stroke="#e5dcd0" stroke-width="2"/>
<rect x="1040" y="250" width="10" height="190" rx="5" fill="#315f9e"/>
<text x="1074" y="310" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#16212d">Pool of Contracts</text>
<text x="1074" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">Contracts, NAV, LMO, replacement</text>
<text x="1074" y="388" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">and portfolio risk are configured.</text>
<rect x="1040" y="650" width="360" height="190" rx="18" fill="#fffdfa" stroke="#e5dcd0" stroke-width="2"/>
<rect x="1040" y="650" width="10" height="190" rx="5" fill="#12845f"/>
<text x="1074" y="710" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#16212d">Standalone Asset</text>
<text x="1074" y="756" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">Predefined quantity, unit value</text>
<text x="1074" y="788" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">and issuance/redemption rules.</text>
<rect x="1490" y="440" width="340" height="190" rx="18" fill="#fffdfa" stroke="#e5dcd0" stroke-width="2"/>
<rect x="1490" y="440" width="10" height="190" rx="5" fill="#b53c3c"/>
<text x="1524" y="500" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#16212d">Validator Submission</text>
<text x="1524" y="546" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">Documents, rules, liquidity policy</text>
<text x="1524" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">and token methodology go to</text>
<text x="1524" y="610" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">validator.</text>
</svg>