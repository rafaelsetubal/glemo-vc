<text x="104" y="500" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#16212d">Public Marketplace</text>
<text x="104" y="546" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">Offerings appear after validation,</text>
<text x="104" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">publication and rule checks.</text>
<rect x="420" y="440" width="300" height="190" rx="18" fill="#fffdfa" stroke="#e5dcd0" stroke-width="2"/>
<rect x="420" y="440" width="10" height="190" rx="5" fill="#17212c"/>
<text x="454" y="500" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#16212d">Wallet Connect</text>
<text x="454" y="546" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">MetaMask, Ledger or compatible</text>
<text x="454" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">wallet proves address control.</text>
<rect x="770" y="440" width="300" height="190" rx="18" fill="#fffdfa" stroke="#e5dcd0" stroke-width="2"/>
<rect x="770" y="440" width="10" height="190" rx="5" fill="#f28c28"/>
<text x="804" y="500" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#16212d">Registration + KYC</text>
<text x="804" y="546" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">Identity, tax ID, sanctions, PEP,</text>
<text x="804" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">fraud checks and terms.</text>
<rect x="1120" y="440" width="300" height="190" rx="18" fill="#fffdfa" stroke="#e5dcd0" stroke-width="2"/>
<rect x="1120" y="440" width="10" height="190" rx="5" fill="#12845f"/>
<text x="1154" y="500" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#16212d">Investor Profile</text>
<text x="1154" y="546" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">Suitability, risk capacity,</text>
<text x="1154" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">investor type and exposure limits.</text>
<rect x="1470" y="440" width="300" height="190" rx="18" fill="#fffdfa" stroke="#e5dcd0" stroke-width="2"/>
<rect x="1470" y="440" width="10" height="190" rx="5" fill="#b53c3c"/>
<text x="1504" y="500" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#16212d">Eligible Investment</text>
<text x="1504" y="546" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">Compatible offerings receive</text>
<text x="1504" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#677381">signed primary purchase orders.</text>
