<rect width="1920" height="1080" fill="#f7f4ef"/>
<text x="60" y="96" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#16212d">DFD 02 - Investor Journey and Eligibility Gate</text>
<text x="60" y="146" font-family="Arial, sans-serif" font-size="27" font-weight="500" fill="#677381">Investor can browse first; investing requires wallet, registration, KYC and suitability.</text>
<line x1="60" y1="176" x2="1860" y2="176" stroke="#e5dcd0" stroke-width="3"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#677381"/></marker></defs>
<line x1="370" y1="535" x2="420" y2="535" stroke="#677381" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="720" y1="535" x2="770" y2="535" stroke="#677381" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1070" y1="535" x2="1120" y2="535" stroke="#677381" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1420" y1="535" x2="1470" y2="535" stroke="#677381" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="440" width="300" height="190" rx="18" fill="#fffdfa" stroke="#e5dcd0" stroke-width="2"/>
