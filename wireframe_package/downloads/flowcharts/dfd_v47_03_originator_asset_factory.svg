<text x="94" y="603" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">Missing items, risk labels and</text>
<text x="94" y="623" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">completeness status</text>
