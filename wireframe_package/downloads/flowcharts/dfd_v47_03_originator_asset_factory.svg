<text x="1084" y="213" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">3. Evidence pack</text>
<text x="1084" y="243" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">Collateral, contracts, pricing,</text>
<text x="1084" y="263" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">disclosures and token rules</text>
