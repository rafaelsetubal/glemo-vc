<text x="589" y="603" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">Review request with immutable evidence</text>
<text x="589" y="623" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">version</text>
<rect x="1060" y="535" width="410" height="175" rx="16" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
