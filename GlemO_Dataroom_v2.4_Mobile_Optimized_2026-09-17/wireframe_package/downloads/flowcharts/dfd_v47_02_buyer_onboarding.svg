<text x="56" y="52" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1F2937">DFD 02 - Buyer Onboarding and Eligibility</text>
<text x="56" y="78" font-family="Arial, sans-serif" font-size="20" fill="#5F657D">Retail and institutional buyers move from public discovery to qualified allocation.</text>
