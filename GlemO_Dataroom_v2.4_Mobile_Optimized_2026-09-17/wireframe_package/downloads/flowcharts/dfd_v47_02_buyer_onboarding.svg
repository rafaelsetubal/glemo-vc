<text x="589" y="603" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">Order, lead, committee pack or standby</text>
<text x="589" y="623" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">review</text>
