<text x="94" y="213" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">1. Discover</text>
<text x="94" y="243" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">Marketplace, channels and asset fact sheet</text>
