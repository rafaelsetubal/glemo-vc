<text x="94" y="603" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">Offering rules decide what the buyer can</text>
<text x="94" y="623" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">see or request</text>
