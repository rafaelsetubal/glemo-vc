<rect x="1060" y="175" width="8" height="175" fill="#0059FF"/>
<text x="1084" y="213" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">3. KYC suitability</text>
<text x="1084" y="243" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">Identity, jurisdiction, risk profile and</text>
<text x="1084" y="263" font-family="Arial, sans-serif" font-size="14" fill="#5F657D">limits</text>
